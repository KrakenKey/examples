name: Renew Certificate

on:
  workflow_dispatch:
    inputs:
      cert-id:
        description: 'Certificate ID to renew (default: the KRAKENKEY_CERT_ID variable)'
        required: false
      force:
        description: 'Renew even if the certificate is not inside its renewal window'
        type: boolean
        default: false
  schedule:
    # Every day except Monday: renew with if-due, which only renews once the
    # certificate is inside the plan's renewal window and otherwise just
    # downloads it. This is the pattern to copy: safe to run daily.
    - cron: '0 2 * * 0,2-6'
    # Monday: renew unconditionally, so KrakenKey's full renewal path is
    # exercised against production every week. Let's Encrypt allows 5
    # certificates per identical set of names per week, so keep this weekly.
    - cron: '0 2 * * 1'

env:
  CERT_ID: ${{ inputs.cert-id || vars.KRAKENKEY_CERT_ID }}

# id-token: write lets the action sign in with GitHub OIDC instead of a stored
# API key. KrakenKey trusts this repository's main branch for certificate 7
# only, with the certs:read and certs:renew scopes.
permissions:
  contents: read
  id-token: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renew certificate
        id: cert
        # Deliberately tracks @main: the scheduled runs double as a canary for
        # cert-action against production. In your own workflows,
        # pin a release tag instead (see the other examples in this repo).
        uses: KrakenKey/cert-action@main
        with:
          # No api-key: the action exchanges the job's GitHub OIDC token for
          # a 15-minute KrakenKey key.
          command: renew
          cert-id: ${{ env.CERT_ID }}
          # The Monday canary and manual runs with force renew unconditionally;
          # everything else only renews when due.
          if-due: ${{ github.event.schedule != '0 2 * * 1' && !inputs.force }}

      - name: Print renewal result
        run: |
          echo "Certificate ID: ${{ steps.cert.outputs.cert-id }}"
          echo "Status:         ${{ steps.cert.outputs.status }}"
          echo "Renewed:        ${{ steps.cert.outputs.renewed }}"
          echo "Domain:         ${{ steps.cert.outputs.domain }}"
          echo "Expires:        ${{ steps.cert.outputs.expires }}"
          echo "Cert path:      ${{ steps.cert.outputs.cert-path }}"
