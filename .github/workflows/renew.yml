name: Renew Certificate

on:
  workflow_dispatch:
    inputs:
      cert-id:
        description: 'Certificate ID to renew'
        required: true
  schedule:
    # Weekly on Mondays at 2am UTC. The manual renew endpoint renews
    # unconditionally today, and Let's Encrypt allows at most 5 certificates
    # per exact identifier set per week (no overrides), so a daily schedule
    # would exhaust that allowance. Revert to daily once the API gains a
    # renewal window check and ARI support makes renewals rate-limit exempt.
    - cron: '0 2 * * 1'

env:
  CERT_ID: ${{ inputs.cert-id || vars.KRAKENKEY_CERT_ID }}

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renew certificate
        id: cert
        # Deliberately tracks @main: this scheduled run doubles as a weekly
        # canary for cert-action against production. In your own workflows,
        # pin a release tag instead (see the other examples in this repo).
        uses: KrakenKey/cert-action@main
        with:
          api-key: ${{ secrets.KRAKENKEY_API_KEY }}
          command: renew
          cert-id: ${{ env.CERT_ID }}

      - name: Print renewal result
        run: |
          echo "Certificate ID: ${{ steps.cert.outputs.cert-id }}"
          echo "Status:         ${{ steps.cert.outputs.status }}"
          echo "Domain:         ${{ steps.cert.outputs.domain }}"
          echo "Expires:        ${{ steps.cert.outputs.expires }}"
          echo "Cert path:      ${{ steps.cert.outputs.cert-path }}"
