name: Download Certificate

on:
  workflow_dispatch:
    inputs:
      cert-id:
        description: 'Certificate ID to download (default: the KRAKENKEY_CERT_ID variable)'
        required: false
  schedule:
    # Daily read-only canary: exercises auth, API, CLI and action end to end
    # without issuing anything, so it is free of rate limit concerns.
    # Scheduled runs fall back to the KRAKENKEY_CERT_ID repository variable.
    - cron: '0 3 * * *'

env:
  CERT_ID: ${{ inputs.cert-id || vars.KRAKENKEY_CERT_ID }}

# id-token: write lets the action sign in with GitHub OIDC instead of a stored
# API key. KrakenKey trusts this repository's main branch for certificate 7
# only, with the certs:read and certs:renew scopes.
permissions:
  contents: read
  id-token: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download certificate
        id: cert
        uses: KrakenKey/cert-action@v1.4.0
        with:
          # No api-key: signs in with GitHub OIDC (see permissions above).
          command: download
          cert-id: ${{ env.CERT_ID }}

      - name: Print certificate details
        run: |
          echo "Certificate ID: ${{ steps.cert.outputs.cert-id }}"
          echo "Status:         ${{ steps.cert.outputs.status }}"
          echo "Domain:         ${{ steps.cert.outputs.domain }}"
          echo "Expires:        ${{ steps.cert.outputs.expires }}"
          echo "Cert path:      ${{ steps.cert.outputs.cert-path }}"

      - name: Verify certificate and chain
        run: |
          openssl x509 -in cert.pem -noout -subject -issuer -dates
          openssl verify -untrusted chain.pem cert.pem

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-certificate
          path: cert.pem
