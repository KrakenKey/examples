name: Download Certificate

on:
  workflow_dispatch:
    inputs:
      cert-id:
        description: 'Certificate ID to download'
        required: true
  schedule:
    # Daily read-only canary: exercises auth, API, CLI and action end to end
    # without issuing anything, so it is free of rate limit concerns.
    # Scheduled runs fall back to the KRAKENKEY_CERT_ID repository variable.
    - cron: '0 3 * * *'

env:
  CERT_ID: ${{ inputs.cert-id || vars.KRAKENKEY_CERT_ID }}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download certificate
        id: cert
        uses: KrakenKey/cert-action@v1.1.0
        with:
          api-key: ${{ secrets.KRAKENKEY_API_KEY }}
          command: download
          cert-id: ${{ env.CERT_ID }}

      - name: Print certificate details
        run: |
          echo "Certificate ID: ${{ steps.cert.outputs.cert-id }}"
          echo "Status:         ${{ steps.cert.outputs.status }}"
          echo "Domain:         ${{ steps.cert.outputs.domain }}"
          echo "Expires:        ${{ steps.cert.outputs.expires }}"
          echo "Cert path:      ${{ steps.cert.outputs.cert-path }}"

      - name: Verify certificate file
        run: openssl x509 -in cert.pem -noout -subject -issuer -dates

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-certificate
          path: cert.pem
