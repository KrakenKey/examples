name: Deploy to Nginx

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name (e.g. example.com)'
        required: true
      server-host:
        description: 'SSH host of the Nginx server'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Issue TLS certificate
        id: cert
        uses: KrakenKey/cert-action@main
        with:
          api-key: ${{ secrets.KRAKENKEY_API_KEY }}
          command: issue
          domain: ${{ inputs.domain }}

      - name: Deploy certificate to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ inputs.server-host }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'cert.pem,key.pem'
          target: /etc/nginx/ssl/${{ inputs.domain }}/

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ inputs.server-host }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sudo nginx -t && sudo systemctl reload nginx
