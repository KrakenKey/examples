name: Issue Certificate

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name (e.g. example.com)'
        required: true
      san:
        description: 'Additional SANs (comma-separated)'
        required: false
        default: ''
      key-type:
        description: 'Key type'
        required: false
        default: 'ecdsa-p256'
        type: choice
        options:
          - ecdsa-p256
          - ecdsa-p384
          - rsa-2048
          - rsa-4096

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - name: Issue TLS certificate
        id: cert
        uses: KrakenKey/cert-action@v1.4.0
        with:
          api-key: ${{ secrets.KRAKENKEY_API_KEY }}
          command: issue
          domain: ${{ inputs.domain }}
          san: ${{ inputs.san }}
          key-type: ${{ inputs.key-type }}

      - name: Print certificate details
        run: |
          echo "Certificate ID: ${{ steps.cert.outputs.cert-id }}"
          echo "Status:         ${{ steps.cert.outputs.status }}"
          echo "Domain:         ${{ steps.cert.outputs.domain }}"
          echo "Issuer:         ${{ steps.cert.outputs.issuer }}"
          echo "Expires:        ${{ steps.cert.outputs.expires }}"
          echo "Fingerprint:    ${{ steps.cert.outputs.fingerprint }}"
          echo "Key type:       ${{ steps.cert.outputs.key-type }}"
          echo "Fullchain path: ${{ steps.cert.outputs.fullchain-path }}"

      # The private key (key.pem) stays on the runner and is discarded with it.
      # Never upload it as an artifact: anyone who can read the repository can
      # download artifacts. In a real workflow, write it straight to a secret
      # store or deploy it to the server in this job (see deploy-nginx.yml).
      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tls-certificate
          path: |
            cert.pem
            chain.pem
            fullchain.pem
            csr.pem
